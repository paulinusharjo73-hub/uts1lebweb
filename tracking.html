<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Lentera Buku - toko buku online: katalog, pemesanan, dan pelacakan pengiriman.">
  <title>Tracking Pengiriman | Lentera Buku</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- CSS eksternal -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="tracking">
  <header class="site-header">
    <div class="container">
      <a class="brand" href="dashboard.html"><img src="assets/logo.svg" alt="" width="34" height="34"><span>Lentera Buku</span></a>
      <nav class="main-nav" aria-label="Navigasi utama">
        <a href="dashboard.html">Beranda</a>
        <a href="stok.html">Stok</a>
        <a href="checkout.html">Pemesanan</a>
        <a href="tracking.html" aria-current="page">Tracking</a>
        <a href="laporan.html">Laporan</a>
        <a href="riwayat.html">Riwayat</a>
      </nav>
      <div class="header-actions">
        <button type="button" id="btnCart" class="btn-cart" aria-label="Buka keranjang belanja"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg><span id="cartCount" class="badge" hidden>0</span></button>
        <span id="userName" class="user-name"></span>
        <button type="button" id="btnLogout" class="btn btn-ghost">Keluar</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="page-head">
      <div>
        <h1>Tracking pengiriman</h1>
        <p>Masukkan Nomor Delivery Order untuk melihat status paket.</p>
      </div>
    </div>

    <section class="panel" aria-labelledby="judulCari">
      <h2 id="judulCari" class="sr-only">Cari pengiriman</h2>
      <form id="formTracking" novalidate>
        <div class="search-box">
          <div class="field">
            <label for="noDO">Nomor Delivery Order</label>
            <input type="text" id="noDO" placeholder="Contoh: DO2026001" autocomplete="off">
            <span class="error-msg"></span>
          </div>
          <button type="submit" class="btn btn-amber" style="align-self:start;margin-top:1.55rem">Cari</button>
        </div>
      </form>
      <div class="sample"><span>Coba nomor ini:</span> <span id="contohDO" style="display:inline-flex;gap:.4rem;flex-wrap:wrap;vertical-align:middle"></span></div>
    </section>

    <div id="hasilTracking"></div>
  </main>
  <footer class="site-footer">
    <p style="margin:0">&copy; <span id="tahun">2026</span> Lentera Buku </p>
  </footer>
  <script src="js/data.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
