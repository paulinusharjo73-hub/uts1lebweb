<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Lentera Buku - toko buku online: katalog, pemesanan, dan pelacakan pengiriman.">
  <title>History Transaksi | Lentera Buku</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- CSS eksternal -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="riwayat">
  <header class="site-header">
    <div class="container">
      <a class="brand" href="dashboard.html"><img src="assets/logo.svg" alt="" width="34" height="34"><span>Lentera Buku</span></a>
      <nav class="main-nav" aria-label="Navigasi utama">
        <a href="dashboard.html">Beranda</a>
        <a href="stok.html">Stok</a>
        <a href="checkout.html">Pemesanan</a>
        <a href="tracking.html">Tracking</a>
        <a href="laporan.html">Laporan</a>
        <a href="riwayat.html" aria-current="page">Riwayat</a>
      </nav>
      <div class="header-actions">
        <button type="button" id="btnCart" class="btn-cart" aria-label="Buka keranjang belanja"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg><span id="cartCount" class="badge" hidden>0</span></button>
        <span id="userName" class="user-name"></span>
        <button type="button" id="btnLogout" class="btn btn-ghost">Keluar</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="page-head">
      <div>
        <h1>History transaksi</h1>
        <p>Cari dan lihat detail setiap pesanan.</p>
      </div>
    </div>

    <div class="toolbar">
      <label class="sr-only" for="cariRiwayat">Cari transaksi</label>
      <input type="search" id="cariRiwayat" class="input" placeholder="Cari nomor DO atau nama pemesan…">
      <div style="display:flex;align-items:center;gap:.6rem"><label for="filterStatus">Status</label>
        <select id="filterStatus" class="input" style="width:auto"><option value="">Semua status</option></select></div>
    </div>

    <div class="table-wrap">
      <table id="tabelRiwayat">
        <caption class="sr-only">Riwayat transaksi</caption>
        <thead><tr><th scope="col">No. DO</th><th scope="col">Tanggal</th><th scope="col">Pemesan</th><th scope="col" class="num">Total</th><th scope="col">Status</th><th scope="col">Aksi</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <dialog id="modalDetail" class="modal wide" aria-labelledby="detailJudul">
    <div class="modal-head"><h2 id="detailJudul">Detail transaksi</h2><button type="button" class="modal-close" data-close-modal aria-label="Tutup">&times;</button></div>
    <div class="modal-body" id="detailBody"></div>
    <div class="modal-foot"><button type="button" class="btn" data-close-modal>Tutup</button></div>
  </dialog>
  <footer class="site-footer">
    <p style="margin:0">&copy; <span id="tahun">2026</span> Lentera Buku</p>
  </footer>
  <script src="js/data.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
